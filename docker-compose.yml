services:
  dw-postgres:
    image: postgres:15-alpine
    container_name: dw-postgres
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-warehouse_user}
      POSTGRES_PASSWORD: ${DB_PASS:-warehouse_password}
      POSTGRES_DB: ${DB_NAME:-ecommerce_warehouse}
    ports:
      - "127.0.0.1:${DB_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
